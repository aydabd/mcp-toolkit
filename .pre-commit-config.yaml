exclude: |-
  (?x)^(
    bin/|
    .tmp/|
    reports/|
    vendor/
  )
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash
        args:
          - -c
          - |
            if ! command -v goimports >/dev/null 2>&1; then
              echo "Installing goimports..."
              go install golang.org/x/tools/cmd/goimports@latest
            fi
            export PATH="$(go env GOPATH)/bin:$PATH"
            if [ "$LINT_MODE" = "check" ]; then
              unformatted=$(goimports -l .)
              if [ -n "$unformatted" ]; then
                echo "❌ Files need formatting:"
                echo "$unformatted"
                echo "Run: make lint"
                exit 1
              fi
            else
              echo "🛠️ Formatting Go files..."
              goimports -w .
            fi
        language: system
        types: [go]
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: bash
        args:
          - -c
          - |
            echo "🔍 Running go vet..."
            go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: bash
        args:
          - -c
          - |
            if ! command -v golangci-lint >/dev/null 2>&1; then
              echo "Installing golangci-lint..."
              go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
            fi
            export PATH="$(go env GOPATH)/bin:$PATH"
            echo "🔍 Running golangci-lint..."
            golangci-lint run --timeout=3m ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: go test
        entry: bash
        args:
          - -c
          - |
            echo "🧪 Running tests with coverage..."
            mkdir -p reports
            go test -race -coverprofile=reports/coverage.out -covermode=atomic ./internal/... || exit 1
            echo "✅ Tests passed"
        language: system
        types: [go]
        pass_filenames: false
      - id: coverage-check
        name: coverage check
        entry: bash
        args:
          - -c
          - |
            COVERAGE_FILE="reports/coverage.out"
            COVERAGE_THRESHOLD=90

            if [ ! -f "$COVERAGE_FILE" ]; then
              echo "⏭️  Coverage file not found - skipping"
              exit 0
            fi

            coverage=$(go tool cover -func="$COVERAGE_FILE" | awk '/total:/ {gsub(/%/,"",$3); print $3}')

            if [ -z "$coverage" ]; then
              echo "⏭️  Could not determine coverage"
              exit 0
            fi

            echo "📊 Coverage: ${coverage}% (threshold: ${COVERAGE_THRESHOLD}%)"

            if [ $(echo "$coverage < $COVERAGE_THRESHOLD" | bc -l) -eq 1 ]; then
              echo "❌ Coverage ${coverage}% is below threshold ${COVERAGE_THRESHOLD}%"
              exit 1
            fi

            echo "✅ Coverage check passed"
        language: system
        files: '^(.*\.go|go\.mod|go\.sum)$'
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: '.*\.(sh|bash)$'
        pass_filenames: true
      - id: prettier
        name: prettier
        entry: bash
        args:
          - -c
          - |
            if [ "$LINT_MODE" = "check" ]; then
              if ! prettier --check "**/*.{json,md,yml,yaml}" 2>/dev/null; then
                echo "❌ Files need formatting. Run: prettier -w \"**/*.{json,md,yml,yaml}\""
                exit 1
              fi
            else
              echo "🛠️ Formatting with prettier..."
              prettier -w "**/*.{json,md,yml,yaml}"
            fi
        language: system
        files: '.*\.(json|md|yml|yaml)$'
        pass_filenames: false
      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        language: system
        files: '.*\.md$'
        pass_filenames: true
