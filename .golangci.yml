version: "2"

run:
  timeout: 3m
  tests: false

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - revive
    - errcheck
    - gosec
    - misspell
    - unused
  settings:
    revive:
      severity: warning
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: package-comments
    gosec:
      excludes: [G204, G301, G302, G304, G306]

issues:
  exclude-dirs:
    - bin
    - vendor
    - .tmp
    - reports
